on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: Maximum time (in minutes) before the job is canceled
        type: number
        default: 5
      java-version:
        description: Java version
        type: number
        default: 17
      is-plugin:
        description: Is this project an SBT plugin?
        type: boolean
        default: false
      publish-scoverage-summary:
        description: Publish Scoverage summary as a comment to the PR?
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gha:test~${{ github.repository }}~${{ github.workflow }}~${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v6
      - uses: coursier/cache-action@v8
      - uses: coursier/setup-action@v3
        with:
          apps: sbt
          jvm: temurin:${{ inputs.java-version }}
      - run: ./test.sh
      # A build may fail on a coverage gate, and the report explaining why it failed is exactly what has to reach the
      # pull request. A plain `if: ${{ inputs.publish-scoverage-summary }}` still carries the implicit `success()`,
      # so the comment would never appear in that case; `!cancelled()` drops it while keeping cancelled runs silent.
      - if: ${{ !cancelled() && inputs.publish-scoverage-summary }}
        uses: h8io/gha/actions/publish-scoverage-summary@v4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
